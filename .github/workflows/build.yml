name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (engine + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Engine tests
        run: cargo test -p crispy-core
      - name: Engine lint (Linux + Windows)
        run: |
          cargo clippy -p crispy-core --all-targets -- -D warnings
          cargo clippy -p crispy-core --target x86_64-pc-windows-gnu -- -D warnings
      - name: UI type check and build
        run: |
          npm ci
          npm run check
          npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Crispy
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Tagged pushes (v1.0.0 ...) publish a draft GitHub release with the installers.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Crispy ${{ github.ref_name }}
          releaseDraft: true
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: crispy-${{ runner.os }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
          if-no-files-found: error
