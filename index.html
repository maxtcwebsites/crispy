<!doctype html>
<html lang="en" data-theme="dark" data-flavor="classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Crispy</title>
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var saved = null;
          try {
            saved = JSON.parse(localStorage.getItem('crispy.look') || 'null');
          } catch (e) {}
          var pref = q || (saved && saved.theme) || 'system';
          var dark = pref === 'system' ? !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (saved && saved.flavor) document.documentElement.setAttribute('data-flavor', saved.flavor);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
