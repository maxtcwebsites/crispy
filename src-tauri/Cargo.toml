[package]
name = "crispy"
description = "Crispy — one keyboard, one mouse, every computer"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "crispy"

[lib]
name = "crispy_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
crispy-core = { path = "../crates/crispy-core" }
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
window-vibrancy = "0.6"
