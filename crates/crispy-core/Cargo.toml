[package]
name = "crispy-core"
description = "Peer-to-peer keyboard, mouse, clipboard and file sharing engine for Crispy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
base64 = "0.22"
bincode = "1.3.3"
dirs = "6"
filetime = "0.2"
hex = "0.4"
if-addrs = "0.13"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
sha2 = "0.10"
snow = { version = "0.9.6", default-features = false, features = ["default-resolver"] }
socket2 = { version = "0.5", features = ["all"] }
spake2 = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
tracing = "0.1"
walkdir = "2"
whoami = "1.5"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
clipboard-rs = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
